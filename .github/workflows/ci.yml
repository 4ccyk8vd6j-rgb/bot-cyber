name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Exécuter la suite de tests
        run: python -m pytest -q

  self-scan:
    name: Auto-analyse (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CyberBot s'analyse lui-même : échoue si un secret High/Critical
      # est détecté ailleurs que dans les fixtures de test.
      - name: Recherche de secrets codés en dur
        run: python cyberbot.py --no-banner --no-report secrets cyberbot
